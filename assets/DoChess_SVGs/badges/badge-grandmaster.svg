<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">DoChess Badge: Grandmaster</title>
<desc id="desc">Reach a rating of 2100</desc>

<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF3D0"/>
    <stop offset=".46" stop-color="#F0B429"/>
    <stop offset="1" stop-color="#5C3A0C"/>
  </linearGradient>
</defs>
<circle cx="64" cy="64" r="55" fill="#101B2B" stroke="#5C3A0C" stroke-width="3"/>
<circle cx="64" cy="64" r="49" fill="none" stroke="url(#ring)" stroke-width="7"/>
<circle cx="64" cy="64" r="40" fill="#F0B429" fill-opacity=".19" stroke="#F0B429" stroke-opacity=".45" stroke-width="1.5"/>
<path d="M30 33A44 44 0 0 1 54 21" fill="none" stroke="#FFF3D0" stroke-width="3" stroke-linecap="round"/>

<!-- Crown: the master tier mark -->
<g>
  <path d="M38 66 32 44l16 11 16-19 16 19 16-11-6 22Z" fill="#FFF3D0" stroke="#5C3A0C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M39.5 70h49L85 80H43Z" fill="#5C3A0C"/>
  <path d="M43.5 75h41" stroke="#FFF3D0" stroke-width="3"/>
</g>

<!-- Star above the crown: the grandmaster star -->
<g>
  <path d="M64 22l5.4 10.9 12 1.8-8.7 8.5 2 12-10.7-5.6-10.7 5.6 2-12-8.7-8.5 12-1.8Z"
        fill="#FFF3D0" stroke="#5C3A0C" stroke-width="2.6" stroke-linejoin="round"/>
</g>

<!-- Rating pips -->
<g fill="#F0B429">
  <circle cx="52" cy="92" r="3.4"/>
  <circle cx="64" cy="94" r="3.4"/>
  <circle cx="76" cy="92" r="3.4"/>
</g>
</svg>