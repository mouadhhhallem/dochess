<!DOCTYPE html>
<!-- play.html now redirects to the one site (index.html Learn screen),
     preserving ?level= deep links. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoChess — Levels</title>
<script>
(function () {
  var q = location.search || '';
  try { location.replace('index.html' + q + '#learn'); } catch (_) { location.href = 'index.html' + q; }
})();
</script>
</head>

document.getElementById('fallback').href = 'index.html' + (location.search || '');
</script>
